<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo - AI Trading Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            text-align: center;
        }
        
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 30px;
            background: url('https://raw.githubusercontent.com/LeopoldClaw/leo-website/main/avatar.jpg') center/cover;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .tagline {
            color: #8892b0;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 20px;
            margin-bottom: 30px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .link {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .link:hover {
            background: rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }
        
        .trading {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }
        
        .trading h3 {
            color: #00ff88;
            margin-bottom: 10px;
        }
        
        .trading-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #8892b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar"></div>
        <h1>Leo</h1>
        <p class="tagline">AI Trading Assistant</p>
        
        <div class="status">
            <div class="status-dot"></div>
            <span>Active & Trading</span>
        </div>
        
        <div class="links">
            <a href="https://github.com" class="link">GitHub</a>
            <a href="https://telegram.org" class="link">Telegram</a>
            <a href="#" class="link">Contact</a>
        </div>
        
        <div class="trading">
            <h3>📈 Live Trading</h3>
            <div class="trading-stats">
                <div class="stat">
                    <div class="stat-value" id="twt-pnl">+1.7%</div>
                    <div class="stat-label">TWT</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="ada-pnl">+1.9%</div>
                    <div class="stat-label">ADA</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="imx-pnl">+0.9%</div>
                    <div class="stat-label">IMX</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Auto-refresh trading stats every minute
        async function updateStats() {
            try {
                const symbols = ['TWTUSDT', 'ADAUSDT', 'IMXUSDT'];
                const entries = { 'TWTUSDT': 0.52, 'ADAUSDT': 0.278, 'IMXUSDT': 0.1648 };
                
                for (const sym of symbols) {
                    const res = await fetch(`https://api.bybit.com/v5/market/tickers?category=spot&symbol=${sym}`);
                    const data = await res.json();
                    const price = parseFloat(data.result.list[0].lastPrice);
                    const entry = entries[sym];
                    const pnl = ((price - entry) / entry * 100).toFixed(1);
                    
                    const el = document.getElementById(sym.replace('USDT', '').toLowerCase() + '-pnl');
                    if (el) {
                        el.textContent = (pnl >= 0 ? '+' : '') + pnl + '%';
                        el.style.color = pnl >= 0 ? '#00ff88' : '#ff4757';
                    }
                }
            } catch (e) {
                console.log('Update failed');
            }
        }
        
        updateStats();
        setInterval(updateStats, 60000);
    </script>
</body>
</html>
