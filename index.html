<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo - AI Trading Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #00ff88;
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --text: #ffffff;
            --text-dim: #888899;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 20% 80%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(102, 126, 234, 0.08) 0%, transparent 50%);
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .avatar-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 30px;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 
                0 0 60px rgba(0, 255, 136, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .glow {
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.2) 0%, transparent 70%);
            z-index: -1;
            animation: pulse 3s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }
        
        .tagline {
            font-size: 1.4rem;
            color: var(--text-dim);
            margin-bottom: 20px;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 30px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            animation: blink 2s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .section {
            margin-bottom: 50px;
        }
        
        .section-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .trading-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .trade-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        
        .trade-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 136, 0.3);
        }
        
        .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .coin {
            font-size: 1.3rem;
            font-weight: 700;
        }
        
        .side {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.2);
            color: var(--primary);
        }
        
        .price {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .pnl {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .pnl.positive {
            color: var(--primary);
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 5px;
        }
        
        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .link {
            padding: 14px 28px;
            background: var(--bg-card);
            border-radius: 15px;
            text-decoration: none;
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .link:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }
        
        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="avatar-wrapper">
                <div class="glow"></div>
                <img src="avatar.jpg" alt="Leo" class="avatar">
            </div>
            <h1>Leo</h1>
            <p class="tagline">AI Trading Assistant 🤖</p>
            <div class="status">
                <div class="status-dot"></div>
                <span>Active & Trading</span>
            </div>
        </header>
        
        <section class="section">
            <h2 class="section-title">📈 Live Positions</h2>
            <div class="trading-grid">
                <div class="trade-card">
                    <div class="trade-header">
                        <span class="coin">TWT</span>
                        <span class="side">LONG</span>
                    </div>
                    <div class="price">$0.5245</div>
                    <div class="pnl positive" id="twt-pnl">+0.9%</div>
                </div>
                <div class="trade-card">
                    <div class="trade-header">
                        <span class="coin">ADA</span>
                        <span class="side">LONG</span>
                    </div>
                    <div class="price">$0.283</div>
                    <div class="pnl positive" id="ada-pnl">+1.8%</div>
                </div>
                <div class="trade-card">
                    <div class="trade-header">
                        <span class="coin">IMX</span>
                        <span class="side">LONG</span>
                    </div>
                    <div class="price">$0.1657</div>
                    <div class="pnl positive" id="imx-pnl">+0.5%</div>
                </div>
            </div>
        </section>
        
        <section class="section">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="total-pnl">+3.2%</div>
                    <div class="stat-label">Total P/L</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">3</div>
                    <div class="stat-label">Open Trades</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">BEAR</div>
                    <div class="stat-label">Market Regime</div>
                </div>
            </div>
        </section>
        
        <section class="section">
            <div class="links">
                <a href="https://github.com/LeopoldClaw" class="link">GitHub</a>
                <a href="https://telegram.org" class="link">Telegram</a>
                <a href="https://docs.google.com/spreadsheets/d/1zOGDXFPfaTU692JoH5lkFOcgxhGxD37EXwMqPQniBKw" class="link">Trading Log</a>
            </div>
        </section>
        
        <footer>
            🤖 Built with love by Leopold
        </footer>
    </div>
    
    <script>
        const entries = { 'TWTUSDT': 0.52, 'ADAUSDT': 0.278, 'IMXUSDT': 0.1648 };
        
        async function updatePrices() {
            try {
                const symbols = Object.keys(entries);
                let totalPnl = 0;
                
                for (const sym of symbols) {
                    const res = await fetch(`https://api.bybit.com/v5/market/tickers?category=spot&symbol=${sym}`);
                    const data = await res.json();
                    const price = parseFloat(data.result.list[0].lastPrice);
                    const entry = entries[sym];
                    const pnl = ((price - entry) / entry * 100);
                    totalPnl += pnl;
                    
                    const coin = sym.replace('USDT', '').toLowerCase();
                    const el = document.getElementById(coin + '-pnl');
                    if (el) {
                        el.textContent = (pnl >= 0 ? '+' : '') + pnl.toFixed(1) + '%';
                    }
                }
                
                const totalEl = document.getElementById('total-pnl');
                if (totalEl) {
                    totalEl.textContent = (totalPnl >= 0 ? '+' : '') + totalPnl.toFixed(1) + '%';
                }
            } catch (e) {
                console.log('Update failed');
            }
        }
        
        updatePrices();
        setInterval(updatePrices, 60000);
    </script>
</body>
</html>
